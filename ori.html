:root {
  --bg: #070a14;
  --surface: #0c1122;
  --surface2: #111831;
  --line: #232c4d;
  --ink: #e8ecff;
  --muted: #8b94b8;
  --gold: #fbbf24;
  --cyan: #66ccff;
  --emerald: #34d399;
  --magenta: #f0f;
  --red: #f87171;
  --safe-area-inset-top: 0px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #070a14;
    --surface: #0c1122;
    --surface2: #111831;
    --line: #232c4d;
    --ink: #e8ecff;
    --muted: #8b94b8;
  }
}
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Space Grotesk', system-ui, sans-serif;
  margin: 0;
}
.mono {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
}
* {
  scrollbar-width: thin;
  scrollbar-color: #2a3560 transparent;
}
*::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
*::-webkit-scrollbar-thumb {
  background: #2a3560;
  border-radius: 3px;
}
@keyframes burroWobble {
  0%,100% {
    transform: rotate(-2deg);
  }
  50% {
    transform: rotate(2deg);
  }
}
@keyframes pulseGold {
  0%,100% {
    box-shadow: 0 0 0 0 rgba(251,191,36,.45);
  }
  50% {
    box-shadow: 0 0 0 7px rgba(251,191,36,0);
  }
}
@keyframes logFlash {
  from {
    background: rgba(102,204,255,.25);
  }
  to {
    background: transparent;
  }
}
@keyframes seedGrow {
  from {
    transform: scaleY(.2);
  }
  to {
    transform: scaleY(1);
  }
}
@keyframes spinSlow {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}
.geo-grab {
  cursor: grab;
  touch-action: none;
}
.geo-grab:active {
  cursor: grabbing;
}
input[type='range'] {
  accent-color: var(--gold);
}
