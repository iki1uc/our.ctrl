  backdrop-filter: var(--tw-backdrop-blur) var(--tw-backdrop-brightness) var(--tw-backdrop-contrast) var(--tw-backdrop-grayscale) var(--tw-backdrop-hue-rotate) var(--tw-backdrop-invert) var(--tw-backdrop-opacity) var(--tw-backdrop-saturate) var(--tw-backdrop-sepia);
}
.transition {
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}
.ease-in-out {
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
}
:root {
  --bg: #07090c;
  --surface: #0c1015;
  --surface2: #11161d;
  --line: #1e2833;
  --ink: #c9d6df;
  --ink-dim: #6b7f8f;
  --accent: #5fd7e8;
  --accent2: #e879c6;
  --accent3: #9be15d;
  --warn: #e8c85f;
  --q1: #5fd7e8;
  --q2: #e879c6;
  --q3: #9be15d;
  --q4: #e8c85f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #07090c;
    --surface: #0c1015;
    --surface2: #11161d;
    --line: #1e2833;
    --ink: #c9d6df;
    --ink-dim: #6b7f8f;
    --accent: #5fd7e8;
    --accent2: #e879c6;
    --accent3: #9be15d;
    --warn: #e8c85f;
  }
}
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}
@keyframes irisspin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}
@keyframes irisspin-rev {
  from {
    transform: rotate(360deg);
  }
  to {
    transform: rotate(0deg);
  }
}
@keyframes pupilpulse {
  0%, 100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.07);
  }
}
@keyframes flowdash {
  from {
    background-position-x: 0;
  }
  to {
    background-position-x: 56px;
  }
}
@keyframes streammove {
  0% {
    transform: translateX(-12%);
    opacity: 0;
  }
  12% {
    opacity: 1;
  }
  88% {
    opacity: 1;
  }
  100% {
    transform: translateX(112%);
    opacity: 0;
  }
}
@keyframes bootin {
  from {
    opacity: 0;
    transform: translateY(3px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@keyframes blinkdot {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.15;
  }
}
@keyframes scanline {
  from {
    transform: translateY(-100%);
  }
  to {
    transform: translateY(400%);
  }
}
.boot-line {
  animation: bootin 0.4s ease both;
}
.stream-band {
  background-image: repeating-linear-gradient(90deg, var(--accent3) 0 14px, transparent 14px 28px);
  background-size: 56px 100%;
  animation: flowdash 0.9s linear infinite;
}
.chip-drag {
  cursor: grab;
}
.chip-drag:active {
  cursor: grabbing;
}
.drop-active {
  outline: 1px dashed var(--accent);
  outline-offset: -6px;
}
.hover\:text-red-400:hover {
  --tw-text-opacity: 1;
  color: rgb(248 113 113 / var(--tw-text-opacity, 1));
}
.hover\:brightness-150:hover {
  --tw-brightness: brightness(1.5);
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}
@media (min-width: 640px) {
  .sm\:mx-5 {
    margin-left: 1.25rem;
    margin-right: 1.25rem;
  }
  .sm\:p-4 {
    padding: 1rem;
  }
  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }
  .sm\:text-\[13px\] {
    font-size: 13px;
  }
  .sm\:text-xs {
    font-size: 0.75rem;
    line-height: 1rem;
  }
}
@media (min-width: 768px) {
  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (min-width: 1024px) {
  .lg\:grid-cols-\[340px_1fr\] {
    grid-template-columns: 340px 1fr;
  }
}
